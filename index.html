</style></head><body><main>
<section class="card top"><div class="brand"><h1>SORTIFY</h1><div class="sub">Sorting visualizer &amp; analyzer</div></div><div class="tb">
<button class="p" id="gen" title="Generate Random Array">⟳ Generate</button><button id="shuf">⤮ Shuffle</button>
<input type="text" id="custom" placeholder="Custom: 8, -3, 15, 8"><button id="apply">Apply</button><span class="sep"></span>
<span class="lbl">Size <b id="szv">24</b></span><input type="range" id="size" min="5" max="60" value="24">
<span class="lbl">Speed <b id="spv">60</b></span><input type="range" id="speed" min="1" max="100" value="60"><span class="sep"></span>
<button id="asc" class="on">↑ Asc</button><button id="dsc">↓ Desc</button><span class="sep"></span>
<button class="p" id="start" title="Start Sorting">▶ Start</button><button id="pause">⏸ Pause</button><button id="resume">⏯ Resume</button><button id="step" title="Step Forward">⏭ Step</button><button id="reset">↺ Reset</button></div></section>
<section class="card orig"><div class="oc"><div class="lbl">Original array · click a panel to follow its steps</div><canvas id="hero"></canvas></div>
<div class="oi"><div class="sh"><b id="ht"></b><span class="pill" id="hs"></span><span id="status"></span><span class="done" id="done"></span></div>
<div class="lg"><span><i style="background:#4f7cff"></i>Unsorted</span><span><i style="background:#fbbf24"></i>Comparing</span><span><i style="background:#f43f5e"></i>Swapping</span><span><i style="background:#d946ef"></i>Pivot / min</span><span><i style="background:#22d3ee"></i>Active</span><span><i style="background:#34d399"></i>Sorted</span></div>
<div class="msg" id="msg"></div></div></section>
<section class="grid" id="panels"></section>
<section class="bot"><div class="card tc"><div class="sh"><b>Performance comparison</b><span id="vt"></span></div><div class="tw"><table id="tbl"></table></div></div>
<div class="three"><div class="card cc"><div class="lbl">Execution time</div><canvas class="ch" id="c1"></canvas></div><div class="card cc"><div class="lbl">Comparisons</div><canvas class="ch" id="c2"></canvas></div><div class="card cc"><div class="lbl">Swaps</div><canvas class="ch" id="c3"></canvas></div></div></section>
</main>
<script>
"use strict";
const ALG=['bubble','insertion','selection','quick'],NAME={bubble:'Bubble Sort',insertion:'Insertion Sort',selection:'Selection Sort',quick:'Quick Sort'},
CX={bubble:['O(n)','O(n²)','O(n²)','O(1)'],insertion:['O(n)','O(n²)','O(n²)','O(1)'],selection:['O(n²)','O(n²)','O(n²)','O(1)'],quick:['O(n log n)','O(n log n)','O(n²)','O(log n)']},
AC={bubble:'#818cf8',insertion:'#22d3ee',selection:'#fbbf24',quick:'#34d399'},
COL={un:[79,124,255],cmp:[251,191,36],swp:[244,63,94],piv:[217,70,239],ok:[52,211,153],act:[34,211,238]};
/* ===== Sorting core (no UI code) ===== */
const Core={
run(algo,input,desc,rec){const a=input.slice(),n=a.length,id=a.map((_,i)=>i),st={cmp:0,swp:0,acc:0},sd=new Uint8Array(n);let pv=-1,ac=-1;
const R=(t,i,j,m)=>{if(rec)rec({t,i,j,m,p:pv,ac,o:id.slice(),sd:sd.slice(),c:st.cmp,s:st.swp})};
const after=(x,y)=>desc?x<y:x>y;
const sw=(i,j)=>{[a[i],a[j]]=[a[j],a[i]];[id[i],id[j]]=[id[j],id[i]];st.swp++;st.acc+=4;R('swap',i,j,`Swap ${a[j]} and ${a[i]}`)};
const c=(i,j,f,y,no)=>{st.cmp++;st.acc+=2;const r=f(a[i],a[j]);R('cmp',i,j,`Compare ${a[i]} with ${a[j]}: ${r?y:no}`);return r};
const mark=(k,m)=>{sd[k]=1;R('mark',k,-1,m||`${a[k]} is in its final position`)};
if(algo==='bubble'){for(let i=0;i<n-1;i++){let s=false;for(let j=0;j<n-i-1;j++)if(c(j,j+1,after,'out of order → swap','in order')){sw(j,j+1);s=true}mark(n-i-1);if(!s){sd.fill(1);break}}}
else if(algo==='insertion'){if(n)sd[0]=1;for(let i=1;i<n;i++){for(let j=i;j>0;j--){ac=j;if(c(j-1,j,after,'out of order → shift left','in place → stop')){ac=j-1;sw(j-1,j)}else break}ac=-1;for(let k=0;k<=i;k++)sd[k]=1;R('mark',i,-1,`Sorted prefix now covers positions 0–${i}`)}}
else if(algo==='selection'){for(let i=0;i<n-1;i++){let m=i;ac=i;pv=m;R('pivot',m,-1,`Assume ${a[m]} is the ${desc?'maximum':'minimum'} of the rest`);
for(let j=i+1;j<n;j++)if(c(j,m,(x,y)=>after(y,x),`new ${desc?'maximum':'minimum'}`,'not better')){m=j;pv=m}
if(m!==i)sw(i,m);pv=-1;ac=-1;mark(i)}if(n)mark(n-1)}
else{const qs=(lo,hi)=>{if(lo>hi)return;if(lo===hi){mark(lo);return}pv=hi;ac=lo;R('pivot',hi,-1,`Pivot = ${a[hi]}`);let i=lo;
for(let j=lo;j<hi;j++){ac=i;if(c(j,hi,(x,y)=>after(y,x),'goes left of pivot','goes right of pivot')){if(i!==j)sw(i,j);i++}}
ac=-1;pv=i;if(i!==hi)sw(i,hi);mark(i,`Pivot ${a[i]} placed at final position ${i}`);pv=-1;qs(lo,i-1);qs(i+1,hi)};qs(0,n-1)}
sd.fill(1);R('done',-1,-1,'Sorted ✓');return{st,a}},
bench(arr,desc){return ALG.map(k=>{let r,reps=0,t0=performance.now(),el=0;do{r=Core.run(k,arr,desc,null);reps++;el=performance.now()-t0}while(el<10&&reps<4000);
const s=r.st;return{k,time:el/reps,cmp:s.cmp,swp:s.swp,acc:s.acc,ok:r.a.every((v,i)=>!i||(desc?r.a[i-1]>=v:r.a[i-1]<=v))}})}};
/* ===== State ===== */
const $=s=>document.querySelector(s),fmtT=ms=>ms<1?(ms*1000).toFixed(1)+' µs':ms.toFixed(2)+' ms',fmtN=v=>Math.round(v).toLocaleString();
const S={arr:[],rg:[0,1],desc:false,steps:{},pos:{},play:false,tok:0,tm:0,focus:'bubble',bench:null,bt:0,doneShown:false};
const end=k=>S.pos[k]>=S.steps[k].length-1,allEnd=()=>ALG.every(end),idle=()=>ALG.every(k=>!S.pos[k]);
const status=(m,bad)=>{$('#status').textContent=m||'';$('#status').style.color=bad?'#fb7185':''};
function gen(n){return Array.from({length:n},()=>5+Math.floor(Math.random()*95))}
function setArray(a){stop();S.arr=a.slice();S.rg=[Math.min(...a),Math.max(...a)];
ALG.forEach(k=>{const st=[{t:'init',i:-1,j:-1,m:'Ready. Press Start Sorting or Step Forward.',p:-1,ac:-1,o:a.map((_,i)=>i),sd:new Uint8Array(a.length),c:0,s:0}];Core.run(k,a,S.desc,x=>st.push(x));S.steps[k]=st;S.pos[k]=0});
$('#size').value=Math.min(60,Math.max(5,a.length));$('#szv').textContent=a.length;measure();upd()}
function measure(){const tk=++S.bt;S.bench=null;$('#tbl').innerHTML='';document.querySelectorAll('.kv').forEach(e=>e.classList.add('meas'));$('#vt').textContent='Measuring real execution time…';
setTimeout(()=>{if(tk!==S.bt)return;try{S.bench=Core.bench(S.arr,S.desc);table();upd()}catch(e){status('Benchmark error: '+e.message,1)}},40)}
/* ===== Playback (one token-guarded timer) ===== */
const dly=()=>Math.max(4,Math.round(700*Math.pow(1-(+$('#speed').value)/100,2)+4));
function fwd(){ALG.forEach(k=>{if(!end(k))S.pos[k]++})}
function loop(tk){if(tk!==S.tok||!S.play)return;try{const sp=+$('#speed').value,n=sp>88?Math.ceil((sp-88)/2):1;for(let q=0;q<n;q++)fwd();upd()}catch(e){stop();status('Playback error: '+e.message,1);return}
if(allEnd()){S.play=false;upd();return}S.tm=setTimeout(()=>loop(tk),dly())}
function stop(){S.play=false;S.tok++;clearTimeout(S.tm)}
function go(){if(S.play||allEnd())return;S.tok++;clearTimeout(S.tm);S.play=true;upd();loop(S.tok)}
function reset(){stop();ALG.forEach(k=>S.pos[k]=0);status('');upd()}
/* ===== DOM updates ===== */
const P={};
function build(){ALG.forEach((k,i)=>{const d=document.createElement('div');d.className='card panel';d.style.animationDelay=i*70+'ms';
d.innerHTML=`<div class="ph"><b style="color:${AC[k]}">● ${NAME[k]}</b><span class="pill">Ready</span></div><canvas class="mini"></canvas><div class="bar"><i></i></div><div class="kv"><div><span>Progress</span><b>0%</b></div><div><span>Exec time</span><b>–</b></div><div><span>Comparisons</span><b>0</b></div><div><span>Swaps</span><b>0</b></div></div>`;
d.onclick=()=>{S.focus=k;upd()};$('#panels').appendChild(d);const b=d.querySelectorAll('b');P[k]={d,cv:d.querySelector('canvas'),pill:d.querySelector('.pill'),bar:d.querySelector('i'),kv:d.querySelector('.kv'),pc:b[1],t:b[2],c:b[3],s:b[4],v:{big:0,lab:13}}})}
const HV={big:0,lab:10};
function upd(){if(!S.arr.length)return;const B=S.bench&&Object.fromEntries(S.bench.map(r=>[r.k,r]));
ALG.forEach(k=>{const p=P[k],L=S.steps[k].length-1,s=S.steps[k][S.pos[k]],pc=L?Math.round(S.pos[k]/L*100):100,e=end(k);
p.d.classList.toggle('f',k===S.focus);p.bar.style.width=pc+'%';p.pc.textContent=pc+'%';p.c.textContent=fmtN(s.c);p.s.textContent=fmtN(s.s);
p.pill.textContent=e?'Sorted ✓':S.play?'Sorting…':S.pos[k]?'Paused':'Ready';p.pill.className='pill'+(e?' ok':S.play?' go':'');
if(B){p.kv.classList.remove('meas');p.t.textContent=fmtT(B[k].time)}});
const k=S.focus,L=S.steps[k].length-1,s=S.steps[k][S.pos[k]],e=end(k);$('#ht').innerHTML=`<span style="color:${AC[k]}">●</span> ${NAME[k]}`;$('#hs').textContent=e?'Sorted ✓':S.play?'Sorting…':S.pos[k]?'Paused':'Ready';$('#hs').className='pill'+(e?' ok':S.play?' go':'');
$('#msg').textContent=s.m;
const fin=allEnd();$('#done').classList.toggle('s',fin&&!!B);if(fin&&B){const f=B.slice().sort((x,y)=>x.time-y.time)[0];$('#done').innerHTML=`✓ <b>All four algorithms sorted the array.</b> Fastest measured: <b>${NAME[f.k]}</b> (${fmtT(f.time)}).`}
$('#start').disabled=S.play||!idle();$('#pause').disabled=!S.play;$('#resume').disabled=S.play||idle()||fin;$('#step').disabled=S.play||fin;
$('#asc').classList.toggle('on',!S.desc);$('#dsc').classList.toggle('on',S.desc)}
function table(){const b=S.bench,o=b.slice().sort((x,y)=>x.time-y.time),top=o[0].k;
$('#vt').textContent=`n = ${S.arr.length} · ${S.desc?'descending':'ascending'} · verified sorted ${b.every(r=>r.ok)?'✓':'✗'} · measured times`;
$('#tbl').innerHTML='<tr><th>Algorithm</th><th>Exec time</th><th>Compar.</th><th>Swaps</th><th>Accesses</th><th title="best · average · worst">Time complexity</th><th>Space</th></tr>'+b.map(r=>`<tr class="${r.k===top?'best':''}"><td style="color:${AC[r.k]}"><b>${NAME[r.k].replace(' Sort','')}</b>${r.k===top?' 🏆':''}</td><td>${fmtT(r.time)}</td><td>${fmtN(r.cmp)}</td><td>${fmtN(r.swp)}</td><td>${fmtN(r.acc)}</td><td>${CX[r.k].slice(0,3).join(' · ')}</td><td>${CX[r.k][3]}</td></tr>`).join('')}
/* ===== Canvas animation engine ===== */
function fit(cv){const d=devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;if(cv.width!==Math.round(w*d)||cv.height!==Math.round(h*d)){cv.width=Math.round(w*d);cv.height=Math.round(h*d)}const x=cv.getContext('2d');x.setTransform(d,0,0,d,0,0);x.clearRect(0,0,w,h);return[x,w,h]}
function rr(x,a,b,w,h,r){if(x.roundRect){x.beginPath();x.roundRect(a,b,w,h,[r,r,0,0]);x.fill()}else x.fillRect(a,b,w,h)}
function paint(cv,v,s,dt,tau){const[x,w,h]=fit(cv);if(!w||!s)return;const n=S.arr.length,A=S.arr,lo=Math.min(0,S.rg[0]),hi=Math.max(0,S.rg[1]),T=v.big?30:Math.min(20,h*.22),H=h-T-4,y=q=>T+(hi-q)/((hi-lo)||1)*H,y0=y(0),gap=n>40?1.5:n>25?3:6,bw=Math.max(1.5,(w-gap*(n+1))/n),k=1-Math.exp(-dt/tau),o=s.o;
if(v.n!==n){v.n=n;v.X=new Float32Array(n);v.Y=new Float32Array(n);v.V=new Float32Array(A);v.C=Array.from({length:n},()=>COL.un.slice());v.fresh=1}
if(lo<0){x.fillStyle='#ffffff22';x.fillRect(0,y0,w,1)}
x.textAlign='center';x.font=`600 ${Math.max(8,Math.min(v.big?15:12,bw*.6))}px system-ui`;
for(let p=0;p<n;p++){const b=o[p],sw=s.t==='swap'&&(p===s.i||p===s.j);let c=COL.un;if(sw)c=COL.swp;else if(p===s.p)c=COL.piv;else if(s.t==='cmp'&&(p===s.i||p===s.j))c=COL.cmp;else if(p===s.ac)c=COL.act;else if(s.sd[p])c=COL.ok;
